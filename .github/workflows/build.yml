name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # This step explicitly resolves the conflicting libunwind dependency first
    - name: Fix Broken APT Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --allow-downgrades libunwind-dev

    - name: Install System Dependencies
      run: |
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libffi-dev \
          libssl-dev \
          libtinfo5 \
          unzip \
          zip \
          libtool \
          pkg-config \
          cmake \
          ccache

    - name: Install Python Build Tools
      run: |
        pip install --upgrade pip
        pip install --user Cython virtualenv buildozer
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build APK with Buildozer
      run: |
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE: "y"
        JAVA_HOME: ${{ env.JAVA_HOME }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
