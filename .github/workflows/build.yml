name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fix Broken APT Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --allow-downgrades libunwind-dev

    - name: Install System Dependencies
      run: |
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libffi-dev \
          libssl-dev \
          libtinfo5 \
          unzip \
          zip \
          libtool \
          pkg-config \
          cmake \
          ccache \
          aidl

    - name: Install Python Build Tools
      run: |
        pip install --upgrade pip
        pip install --user Cython virtualenv buildozer
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # Creates and populates Buildozer's exact target license folder ahead of time
    - name: Pre-seed Buildozer Android SDK Licenses
      run: |
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "89354db23b24ba1175f024e508ba5692be4e03a0\nd56f5187479451eabf01fb74bf367004a4b46311\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n351336901d6efe34e02b7f52dbb1303cc17f1a16" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build APK with Buildozer
      run: |
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE: "y"
        JAVA_HOME: ${{ env.JAVA_HOME }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
