name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libsqlite3-dev \
          sqlite3 \
          bzip2 \
          libbz2-dev \
          libffi-dev \
          libssl-dev \
          libgmp3-dev \
          lzma \
          liblzma-dev \
          zip \
          unzip

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" cython

    - name: Link GitHub's Android SDK to Buildozer
      run: |
        # Create Buildozer's target directory layout
        mkdir -p $HOME/.buildozer/android/platform
        
        # Link GitHub's pre-installed, valid Android SDK directly into Buildozer
        ln -s $ANDROID_HOME $HOME/.buildozer/android/platform/android-sdk
        
        # Absolute fix for your original 'tools/bin/sdkmanager does not exist' crash
        # This links the modern cmdline-tools manager right into the old legacy path Buildozer checks
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # Accept all SDK licenses automatically
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Build Debug APK with Buildozer
      run: |
        # Use debug mode so the APK can be immediately installed on your phone
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
