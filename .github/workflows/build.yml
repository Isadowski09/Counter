name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Uses a pre-built docker container containing all Buildozer + Android SDK/NDK tools
    - name: Build APK with Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v3
      with:
        buildozer_version: stable
        command: buildozer android debug
        repository_root: .

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
